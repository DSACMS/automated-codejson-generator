version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - major
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      # Must match the version baked into the base image; bump it with a base rebuild (CONTRIBUTING.md).
      - dependency-name: "node-llama-cpp"
      # typescript-eslint and ts-jest don't support TypeScript 7 yet.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
    groups:
      npm:
        patterns:
          - "*"
        update-types:
          - major
          - minor
          - patch
