name: Release a New Verison

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get release label
        id: label
        env:
          LABELS: ${{ toJson(github.event.pull_request.labels) }}
        run: |
          if echo "$LABELS" | grep -q 'release:major'; then
            echo "bump=major" >> $GITHUB_OUTPUT
          elif echo "$LABELS" | grep -q 'release:minor'; then
            echo "bump=minor" >> $GITHUB_OUTPUT
          elif echo "$LABELS" | grep -q 'release:patch'; then
            echo "bump=patch" >> $GITHUB_OUTPUT
          elif echo "$LABELS" | grep -q 'release:none'; then
            echo "No release requested."
            echo "bump=none" >> $GITHUB_OUTPUT
          else
            echo "No release label found. Add one of:"
            echo "release:patch | release:minor | release:major | release:none"
            exit 1
          fi

      - name: Get latest version tag
        if: steps.label.outputs.bump != 'none'
        id: version
        run: |
          latest=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          echo "latest=$latest" >> $GITHUB_OUTPUT

      - name: Calculate next version
        if: steps.label.outputs.bump != 'none'
        id: next
        env:
          LATEST: ${{ steps.version.outputs.latest }}
          BUMP: ${{ steps.label.outputs.bump }}
        run: |
          version=${LATEST#v}
          IFS='.' read -r major minor patch <<< "$version"

          case "$BUMP" in
            major)
              major=$((major+1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor+1))
              patch=0
              ;;
            patch)
              patch=$((patch+1))
              ;;
          esac

          next="v$major.$minor.$patch"
          echo "next=$next" >> $GITHUB_OUTPUT

      - name: Create version tag
        if: steps.label.outputs.bump != 'none'
        env:
          NEXT: ${{ steps.next.outputs.next }}
        run: |
          git tag "$NEXT"
          git push origin "$NEXT"

      - name: Update moving major tag (v1)
        if: steps.label.outputs.bump != 'none'
        env:
          NEXT: ${{ steps.next.outputs.next }}
        run: |
          major="${NEXT%%.*}"
          git tag -f "$major"
          git push origin "$major" --force

      - name: Create GitHub Release
        if: steps.label.outputs.bump != 'none'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.next.outputs.next }}
          name: Release ${{ steps.next.outputs.next }}
          generate_release_notes: true
