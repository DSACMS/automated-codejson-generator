name: Update Contributors Information

on:
  workflow_dispatch: {}
  schedule:
    # Weekly on Saturdays.
    - cron: "30 1 * * 6"

jobs:
  update-contributors:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Update contributor list
        id: contrib_list
        uses: akhilmhdh/contributors-readme-action@v2.3.11
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          readme_path: MAINTAINERS.md
          use_username: false
          commit_message: "update contributors information"

      - name: Update contributors count
        id: count
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CONTRIBUTORS=$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/$GITHUB_REPOSITORY/contributors?per_page=100" | \
            jq '[.[] | select(.type != "Bot" and (.login | test("\\[bot\\]$") | not) and (.login | test("-bot$") | not))] | length')

          echo "Total contributors: $CONTRIBUTORS"
          echo "contributors=$CONTRIBUTORS" >> $GITHUB_OUTPUT

          perl -i -pe 's/(<!--CONTRIBUTOR COUNT START-->).*?(<!--CONTRIBUTOR COUNT END-->)/$1 '"$CONTRIBUTORS"' $2/' MAINTAINERS.md

      # The default branch is protected, so the count goes in through a pull request.
      # The contributor list above opens its own pull request for the same reason.
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "update contributors count to ${{ steps.count.outputs.contributors }}"
          title: "update contributors count to ${{ steps.count.outputs.contributors }}"
          body: "Weekly contributor count refresh for MAINTAINERS.md."
          branch: automated/update-contributors-count
          delete-branch: true
          add-paths: MAINTAINERS.md
